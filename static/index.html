<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Typing Trainer</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }
    main { width: 100%; max-width: 760px; }
    h1 { margin-top: 0; }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
    }
    select, textarea, button {
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #e2e8f0;
      padding: 10px;
    }
    textarea { width: 100%; min-height: 140px; resize: vertical; }
    button {
      cursor: pointer;
      background: #2563eb;
      border-color: #2563eb;
      color: white;
      font-weight: 600;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .text {
      font-size: 20px;
      line-height: 1.6;
      white-space: pre-wrap;
      min-height: 90px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 12px;
    }
    .stat {
      background: #0f172a;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }
    .value { font-size: 22px; font-weight: 700; }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <main>
    <h1>Тренажёр слепого ввода</h1>

    <section class="card">
      <label for="language">Язык</label>
      <select id="language">
        <option value="en">English</option>
        <option value="ru">Русский</option>
      </select>

      <button id="load">Новый текст</button>
      <button id="finish" disabled>Завершить</button>
    </section>

    <section class="card">
      <div id="practice-text" class="text">Выберите язык и нажмите «Новый текст».</div>
    </section>

    <section class="card">
      <textarea
        id="input"
        placeholder="Начните печатать здесь..."
        disabled
      ></textarea>

      <div class="stats">
        <div class="stat">
          <div>WPM</div>
          <div class="value" id="wpm">0</div>
        </div>
        <div class="stat">
          <div>Точность</div>
          <div class="value" id="accuracy">0%</div>
        </div>
        <div class="stat">
          <div>Время</div>
          <div class="value" id="time">0 c</div>
        </div>
      </div>

      <p id="message" class="error"></p>
    </section>
  </main>

  <script>
    const languageSelect = document.getElementById("language");
    const loadButton = document.getElementById("load");
    const finishButton = document.getElementById("finish");
    const practiceText = document.getElementById("practice-text");
    const input = document.getElementById("input");
    const wpmElement = document.getElementById("wpm");
    const accuracyElement = document.getElementById("accuracy");
    const timeElement = document.getElementById("time");
    const message = document.getElementById("message");

    let currentTextId = null;
    let startTime = null;
    let timerId = null;

    function setStats() {
      if (!startTime) return;

      const seconds = (Date.now() - startTime) / 1000;
      const typed = input.value;
      const words = practiceText.textContent.trim().split(/\s+/).length;
      const wpm = seconds > 0 ? Math.round(words / (seconds / 60)) : 0;

      let correct = 0;
      for (let i = 0; i < typed.length; i++) {
        if (typed[i] === practiceText.textContent[i]) correct++;
      }

      const accuracy = typed.length
        ? Math.round((correct / typed.length) * 100)
        : 0;

      wpmElement.textContent = wpm;
      accuracyElement.textContent = accuracy + "%";
      timeElement.textContent = Math.floor(seconds) + " c";
    }

    input.addEventListener("input", () => {
      if (!startTime) {
        startTime = Date.now();
        timerId = setInterval(setStats, 200);
      }
      setStats();
    });

    loadButton.addEventListener("click", async () => {
      message.textContent = "";
      const language = languageSelect.value;

      const response = await fetch(
        `/texts/random?language=${language}`
      );

      if (!response.ok) {
        message.textContent = "Не удалось загрузить текст.";
        return;
      }

      const data = await response.json();

      currentTextId = data.text_id;
      practiceText.textContent = data.content;
      input.value = "";
      input.disabled = false;
      finishButton.disabled = false;
      startTime = null;
      clearInterval(timerId);
      wpmElement.textContent = "0";
      accuracyElement.textContent = "0%";
      timeElement.textContent = "0 c";
    });

    finishButton.addEventListener("click", async () => {
      if (!currentTextId || !startTime) return;

      clearInterval(timerId);
      const duration = (Date.now() - startTime) / 1000;

      const response = await fetch("/sessions/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          text_id: currentTextId,
          typed_text: input.value,
          duration_seconds: duration,
        }),
      });

      if (!response.ok) {
        message.textContent = "Не удалось сохранить результат.";
        return;
      }

      const result = await response.json();

      wpmElement.textContent = result.wpm;
      accuracyElement.textContent = result.accuracy + "%";
      timeElement.textContent = Math.round(result.duration_seconds) + " c";
      input.disabled = true;
      finishButton.disabled = true;
      message.textContent = "Результат сохранён.";
    });
  </script>
</body>
</html>
