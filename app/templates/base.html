<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}Тренажер слепого ввода{% endblock %}</title>

        <link rel="stylesheet" href="/static/css/style.css">
    </head>
    <body>
        <header class="site-header">
            <a href="/" class="logo">⌨️ Typing Trainer</a>

            <nav>
                {% if current_user %}
                <a href="/practice">Практика</a>
                <a href="/texts/import">Импорт</a>
                <a href="/profile">Профиль</a>
                <form action="/logout" method="post" class="inline-form">
                    <button type="submit" class="link-button">Выйти</button>
                </form>
                {% else %}
                <a href="/login">Вход</a>
                <a href="/register">Регистрация</a>
                {% endif %}
            </nav>
        </header>
        <main class="container">
            {% if messages %}
            <div class="messages">
                {% for message in messages %}
                <div class="message message-{{ message.category }}">
                    {{ message.text }}
                </div>
                {% endfor %}
            </div>
            {% endif %}
            {% block content %}{% endblock %}
        </main>

        <footer class="site-footer">
            <p>Тренажер слепого ввода</p>
        </footer>

        {% block scripts %}{% endblock %}
    </body>
</html>
