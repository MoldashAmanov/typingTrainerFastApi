{% extends 'base.html' %}

{% block title %}Регистрация - Тренажер слепого ввода{% endblock %}

{% block content %}
<section class="card form-card">
    <h2>Регистрация</h2>

    <form action="/auth/register" method="post" class="form">
        <label for="email">Email</label>
        <input
        id="email"
        name="email"
        type="email"
        required
        placeholder="you@example.com"
        >

        <label for="username">Имя пользователя</label>
        <input
        id="username"
        name="username"
        type="text"
        minlength="3"
        maxlength="50"
        required
        >

        <label for="password">Пароль</label>
        <input
        id="password"
        name="password"
        type="password"
        minlength="8"
        required
        >

        <button type="submit" class="button">Зарегистрироваться</button>
    </form>
    <p class="form-hint">
        Уже есть аккаунт?
        <a href="/login">Войти</a>
    </p>
</section>
{% endblock %}
